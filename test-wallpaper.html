<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wallpaper Test</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { background: #000; }
body { background: transparent; min-height: 100vh; }
#wallpaper-layer {
  position: fixed;
  inset: 0;
  z-index: 1;
  background-image: linear-gradient(135deg, #1a472a 0%, #2d6a4f 50%, #52b788 100%);
}
#content {
  position: relative;
  z-index: 10;
  color: white;
  padding: 40px;
  font-family: sans-serif;
  font-size: 24px;
}
</style>
</head>
<body>
  <div id="wallpaper-layer"></div>
  <div id="content">
    ✅ Nếu bạn thấy NỀN XANH LÁ (gradient) phía sau chữ này = CSS hoạt động đúng!<br><br>
    ❌ Nếu nền vẫn ĐEN = có vấn đề với trình duyệt hoặc server.
  </div>
</body>
</html>
