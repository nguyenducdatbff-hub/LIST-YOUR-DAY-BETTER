<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" fill="#1e1b4b"/>
  <rect width="512" height="512" rx="100" fill="url(#bg_grad)"/>
  
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  
  <!-- Checkmark circle -->
  <circle cx="220" cy="260" r="110" fill="none" stroke="white" stroke-width="28" opacity="0.9"/>
  <polyline points="170,260 210,300 275,220" fill="none" stroke="white" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Sparkle dots -->
  <circle cx="370" cy="140" r="18" fill="#fbbf24"/>
  <circle cx="400" cy="100" r="10" fill="#fbbf24" opacity="0.6"/>
  <circle cx="340" cy="110" r="8" fill="#fbbf24" opacity="0.4"/>
  
  <!-- Small stars -->
  <text x="350" y="185" font-size="48" text-anchor="middle">✨</text>
</svg>
